name: Build MAHI POS Cashier APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-cashier/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-cashier

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAHI-POS-Cashier-APK
          path: android-cashier/app/build/outputs/apk/debug/app-debug.apk
